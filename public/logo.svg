<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="60" fill="url(#emeraldGlow)"/>

  <!-- Pixel / Minecraft Block Frame -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#blockBg)" stroke="#6ee7b7" stroke-width="4"/>
  <rect x="22" y="22" width="84" height="84" rx="18" fill="#064e3b" stroke="#10b981" stroke-width="3"/>

  <!-- Corner Highlight Pixel -->
  <rect x="26" y="26" width="12" height="12" rx="3" fill="#a7f3d0"/>

  <!-- Crown Emoji / Icon in Center -->
  <text x="64" y="80" font-size="56" text-anchor="middle" dominant-baseline="central">👑</text>
</svg>
